Organizations:
  - &Org0
    Name: Org0
    ID: Org0MSP
    MSPDir: /tmp/hyperledger/org0/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Org0MSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('Org0MSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('Org0MSP.admin')"
    OrdererEndpoints:
      - orderer1-org0:7050
      - orderer2-org0:7050
      - orderer3-org0:7050
      - orderer4-org0:7050
  - &Org1
    Name: Org1MSP
    ID: Org1MSP
    MSPDir: /tmp/hyperledger/org1/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Org1MSP.admin', 'Org1MSP.peer', 'Org1MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Org1MSP.admin', 'Org1MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Org1MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Org1MSP.peer')"
    AnchorPeers:
      - Host: peer1-org1
        Port: 7051
  - &Org2
    Name: Org2MSP
    ID: Org2MSP
    MSPDir: /tmp/hyperledger/org2/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Org2MSP.admin', 'Org2MSP.peer', 'Org2MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Org2MSP.admin', 'Org2MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Org2MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Org2MSP.peer')"
    AnchorPeers:
      - Host: peer1-org2
        Port: 7051

Capabilities:
  Channel: &ChannelCapabilities
    V3_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: 'ANY Readers'
    Writers:
      Type: ImplicitMeta
      Rule: 'ANY Writers'
    Admins:
      Type: ImplicitMeta
      Rule: 'MAJORITY Admins'
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: 'MAJORITY Endorsement'
    Endorsement:
      Type: ImplicitMeta
      Rule: 'MAJORITY Endorsement'
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: 'ANY Readers'
    Writers:
      Type: ImplicitMeta
      Rule: 'ANY Writers'
    Admins:
      Type: ImplicitMeta
      Rule: 'MAJORITY Admins'
    BlockValidation:
      Type: ImplicitMeta
      Rule: 'ANY Writers'

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: 'ANY Readers'
    Writers:
      Type: ImplicitMeta
      Rule: 'ANY Writers'
    Admins:
      Type: ImplicitMeta
      Rule: 'MAJORITY Admins'
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  ChannelUsingBFT:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *Org0
      Capabilities: *OrdererCapabilities
      OrdererType: BFT
      SmartBFT:
        RequestBatchMaxCount: 100
        RequestBatchMaxInterval: 50ms
        RequestForwardTimeout: 2s
        RequestComplainTimeout: 20s
        RequestAutoRemoveTimeout: 3m0s
        ViewChangeResendInterval: 5s
        ViewChangeTimeout: 20s
        LeaderHeartbeatTimeout: 1m0s
        CollectTimeout: 1s
        RequestBatchMaxBytes: 10485760
        IncomingMessageBufferSize: 200
        RequestPoolSize: 100000
        LeaderHeartbeatCount: 10
      ConsenterMapping:
        - ID: 1
          Host: orderer1-org0
          Port: 7050
          MSPID: Org0MSP
          Identity: /tmp/hyperledger/org0/orderers/orderer1/msp/signcerts/orderer1-org0-cert.pem
          ClientTLSCert: /tmp/hyperledger/org0/orderers/orderer1/tls/server.crt
          ServerTLSCert: /tmp/hyperledger/org0/orderers/orderer1/tls/server.crt
        - ID: 2
          Host: orderer2-org0
          Port: 7050
          MSPID: Org0MSP
          Identity: /tmp/hyperledger/org0/orderers/orderer2/msp/signcerts/orderer2-org0-cert.pem
          ClientTLSCert: /tmp/hyperledger/org0/orderers/orderer2/tls/server.crt
          ServerTLSCert: /tmp/hyperledger/org0/orderers/orderer2/tls/server.crt
        - ID: 3
          Host: orderer3-org0
          Port: 7050
          MSPID: Org0MSP
          Identity: /tmp/hyperledger/org0/orderers/orderer3/msp/signcerts/orderer3-org0-cert.pem
          ClientTLSCert: /tmp/hyperledger/org0/orderers/orderer3/tls/server.crt
          ServerTLSCert: /tmp/hyperledger/org0/orderers/orderer3/tls/server.crt
        - ID: 4
          Host: orderer4-org0
          Port: 7050
          MSPID: Org0MSP
          Identity: /tmp/hyperledger/org0/orderers/orderer4/msp/signcerts/orderer4-org0-cert.pem
          ClientTLSCert: /tmp/hyperledger/org0/orderers/orderer4/tls/server.crt
          ServerTLSCert: /tmp/hyperledger/org0/orderers/orderer4/tls/server.crt
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Org1
        - *Org2
      Capabilities: *ApplicationCapabilities
