version: '3'

networks:
  net:
    name: ${DOCKER_NETWORK_NAME}

services:
  rca-org0:
    container_name: rca-org0
    extends:
      file: docker-base.yaml
      service: ca-base
    command: sh -c 'fabric-ca-server start -d -b rca-org0-admin:rca-org0-admin-pw'
    environment:
      - FABRIC_CA_SERVER_CA_NAME=rca-org0
      - FABRIC_CA_SERVER_CSR_HOSTS=rca-org0
    volumes:
      - /tmp/hyperledger/fabric-ca/org0:/tmp/hyperledger/fabric-ca-server

  rca-org1:
    container_name: rca-org1
    extends:
      file: docker-base.yaml
      service: ca-base
    command: sh -c 'fabric-ca-server start -d -b rca-org1-admin:rca-org1-admin-pw'
    environment:
      - FABRIC_CA_SERVER_CA_NAME=rca-org1
      - FABRIC_CA_SERVER_CSR_HOSTS=rca-org1
    volumes:
      - /tmp/hyperledger/fabric-ca/org1:/tmp/hyperledger/fabric-ca-server

  rca-org2:
    container_name: rca-org2
    extends:
      file: docker-base.yaml
      service: ca-base
    command: sh -c 'fabric-ca-server start -d -b rca-org2-admin:rca-org2-admin-pw'
    environment:
      - FABRIC_CA_SERVER_CA_NAME=rca-org2
      - FABRIC_CA_SERVER_CSR_HOSTS=rca-org2
    volumes:
      - /tmp/hyperledger/fabric-ca/org2:/tmp/hyperledger/fabric-ca-server

  orderer1-org0:
    container_name: orderer1-org0
    extends:
      file: docker-base.yaml
      service: orderer-base
    volumes:
      - /tmp/hyperledger/org0/orderers/orderer1/msp:/tmp/hyperledger/orderer/msp
      - /tmp/hyperledger/org0/orderers/orderer1/tls:/tmp/hyperledger/orderer/tls

  orderer2-org0:
    container_name: orderer2-org0
    extends:
      file: docker-base.yaml
      service: orderer-base
    volumes:
      - /tmp/hyperledger/org0/orderers/orderer2/msp:/tmp/hyperledger/orderer/msp
      - /tmp/hyperledger/org0/orderers/orderer2/tls:/tmp/hyperledger/orderer/tls

  orderer3-org0:
    container_name: orderer3-org0
    extends:
      file: docker-base.yaml
      service: orderer-base
    volumes:
      - /tmp/hyperledger/org0/orderers/orderer3/msp:/tmp/hyperledger/orderer/msp
      - /tmp/hyperledger/org0/orderers/orderer3/tls:/tmp/hyperledger/orderer/tls

  orderer4-org0:
    container_name: orderer4-org0
    extends:
      file: docker-base.yaml
      service: orderer-base
    volumes:
      - /tmp/hyperledger/org0/orderers/orderer4/msp:/tmp/hyperledger/orderer/msp
      - /tmp/hyperledger/org0/orderers/orderer4/tls:/tmp/hyperledger/orderer/tls

  peer1-org1:
    container_name: peer1-org1
    extends:
      file: docker-base.yaml
      service: peer-base
    environment:
      - CORE_PEER_ID=peer1-org1
      - CORE_PEER_ADDRESS=peer1-org1:7051
      - CORE_PEER_CHAINCODEADDRESS=peer1-org1:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1-org1:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1-org1:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_OPERATIONS_LISTENADDRESS=peer1-org1:9444
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer1-org1"}
      # - CORE_PEER_LISTENADDRESS=peer1-org1:7051
      # - CORE_PEER_CHAINCODELISTENADDRESS=peer1-org1:7052
    volumes:
      - /tmp/hyperledger/org1/peers/peer1:/tmp/hyperledger/fabric

  peer2-org1:
    container_name: peer2-org1
    extends:
      file: docker-base.yaml
      service: peer-base
    environment:
      - CORE_PEER_ID=peer2-org1
      - CORE_PEER_ADDRESS=peer2-org1:7051
      - CORE_PEER_CHAINCODEADDRESS=peer2-org1:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer2-org1:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer2-org1:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_OPERATIONS_LISTENADDRESS=peer2-org1:9444
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer2-org1"}
      # - CORE_PEER_LISTENADDRESS=peer2-org1:7051
      # - CORE_PEER_CHAINCODELISTENADDRESS=peer2-org1:7052
    volumes:
      - /tmp/hyperledger/org1/peers/peer2:/tmp/hyperledger/fabric

  peer1-org2:
    container_name: peer1-org2
    extends:
      file: docker-base.yaml
      service: peer-base
    environment:
      - CORE_PEER_ID=peer1-org2
      - CORE_PEER_ADDRESS=peer1-org2:7051
      - CORE_PEER_CHAINCODEADDRESS=peer1-org2:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1-org2:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1-org2:7051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_OPERATIONS_LISTENADDRESS=peer1-org2:9444
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer1-org2"}
      # - CORE_PEER_LISTENADDRESS=peer1-org2:7051
      # - CORE_PEER_CHAINCODELISTENADDRESS=peer1-org2:7052
    volumes:
      - /tmp/hyperledger/org2/peers/peer1:/tmp/hyperledger/fabric

  peer2-org2:
    container_name: peer2-org2
    extends:
      file: docker-base.yaml
      service: peer-base
    environment:
      - CORE_PEER_ID=peer2-org2
      - CORE_PEER_ADDRESS=peer2-org2:7051
      - CORE_PEER_CHAINCODEADDRESS=peer2-org2:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer2-org2:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer2-org2:7051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_OPERATIONS_LISTENADDRESS=peer2-org2:9444
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer2-org2"}
      # - CORE_PEER_LISTENADDRESS=peer2-org2:7051
      # - CORE_PEER_CHAINCODELISTENADDRESS=peer2-org2:7052
    volumes:
      - /tmp/hyperledger/org2/peers/peer2:/tmp/hyperledger/fabric

  cli-org0:
    container_name: cli-org0
    extends:
      file: docker-base.yaml
      service: cli-base
    volumes:
      - /tmp/hyperledger/org0:/tmp/hyperledger/org0

  cli-org1:
    container_name: cli-org1
    extends:
      file: docker-base.yaml
      service: cli-base
    environment:
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ROOTCERT_FILE=/tmp/hyperledger/org1/tlsca/tlsca-cert.pem
      - CORE_PEER_MSPCONFIGPATH=/tmp/hyperledger/org1/users/admin/msp
      - CORE_PEER_ADDRESS=peer1-org1:7051
      - CORE_PEER_TLS_ENABLED=true
    volumes:
      - /tmp/hyperledger/org1:/tmp/hyperledger/org1
      - /tmp/hyperledger/org0:/tmp/hyperledger/org0
      - /tmp/hyperledger/org2:/tmp/hyperledger/org2
      - ${SCRIPT_DIR}/chaincode:/opt/gopath/src/github.com/chaincode

  cli-org2:
    container_name: cli-org2
    extends:
      file: docker-base.yaml
      service: cli-base
    environment:
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_TLS_ROOTCERT_FILE=/tmp/hyperledger/org2/tlsca/tlsca-cert.pem
      - CORE_PEER_MSPCONFIGPATH=/tmp/hyperledger/org2/users/admin/msp
      - CORE_PEER_ADDRESS=peer1-org2:7051
      - CORE_PEER_TLS_ENABLED=true
    volumes:
      - /tmp/hyperledger/org2:/tmp/hyperledger/org2
      - /tmp/hyperledger/org0:/tmp/hyperledger/org0
      - ${SCRIPT_DIR}/chaincode:/opt/gopath/src/github.com/chaincode
